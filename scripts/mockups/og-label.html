<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Open Graph image, illustrative label</title>
<link rel="stylesheet" href="kit.css">
<style>
  html, body { margin: 0; background: #0b0b0e; }
  #og { position: relative; width: 1200px; height: 630px; overflow: hidden; }
  #og img { position: absolute; inset: 0; width: 1200px; height: 630px; }
  #og .label { position: absolute; left: 28px; bottom: 26px; padding: 11px 20px; border-radius: 999px; background: rgba(11, 11, 14, 0.82); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18); color: #f2efe8; font-size: 24px; font-weight: 600; letter-spacing: 0.01em; }
  #og .label span { color: rgba(242, 239, 232, 0.6); font-weight: 500; }
</style>
</head>
<body>
<!-- A project's share image with the bilingual label of the page caption (set by scripts/og-images.ts). -->
<div id="og"><img id="bg" alt=""><div class="label">Maquette illustrative <span>·</span> Illustrative mock-up</div></div>
</body>
</html>
