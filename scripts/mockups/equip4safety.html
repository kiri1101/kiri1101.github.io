<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>equip4safety — screenshots framed</title>
<link rel="stylesheet" href="kit.css">
<style>
  .eq { --from: #1c0f0c; --to: #3d1f17; }
  .eq .body img { position: absolute; display: block; }
</style>
</head>
<body>

<!-- The owner-validated screenshot of the marketplace (legacy/img), framed in Orbit's browser window. -->
<section class="shot cover eq" data-shot="cover">
  <div class="orbits"><i style="width:1500px;height:520px"></i><i style="width:1100px;height:380px"></i></div>
  <div class="window" style="left:100px;top:140px;width:1400px;height:921px">
    <div class="titlebar"><i></i><i></i><i></i><span class="url"><b>equip4safety</b>/marketplace</span></div>
    <div class="body"><img src="/legacy/img/equip4safety.webp" alt="" style="left:0;top:0;width:1400px;height:875px"></div>
  </div>
</section>

<section class="shot portrait eq" data-shot="cover-phone" data-reframe="cover" data-frame="800,560,1.5"></section>

<!-- The same screenshot, enlarged on the filters and the first listings. -->
<section class="shot eq" data-shot="section-1">
  <div class="orbits"><i style="width:1500px;height:520px"></i><i style="width:1100px;height:380px"></i></div>
  <div class="window" style="left:150px;top:90px;width:1300px;height:820px">
    <div class="titlebar"><i></i><i></i><i></i><span class="url"><b>equip4safety</b>/marketplace</span></div>
    <div class="body"><img src="/legacy/img/equip4safety.webp" alt="" style="left:-10px;top:-450px;width:2160px;height:1350px"></div>
  </div>
</section>

<script src="kit.js"></script>
</body>
</html>
