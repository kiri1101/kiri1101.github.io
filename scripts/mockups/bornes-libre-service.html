<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bornes-libre-service — kiosk screens</title>
<link rel="stylesheet" href="kit.css">
<style>
  .bk { --from: #0d1420; --to: #1b2c4a; }
  /* The kiosk screens are the owner's, with the client's logo replaced and other identifying details removed
     (scripts/mockups/assets/bornes-libre-service/). Framed here as the kiosk's 1280 x 1024 display. */
  .bk .tablet { padding: 14px; border-radius: 34px; }
  .bk .tablet .screen { border-radius: 20px; background: #f5ece0; }
  .bk .tablet img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>

<section class="shot cover bk" data-shot="cover">
  <div class="orbits"><i style="width:1500px;height:520px"></i><i style="width:1100px;height:380px"></i></div>
  <div class="tablet" style="left:610px;top:270px;width:840px;height:680px;transform:rotate(3deg)"><div class="screen"><img src="assets/bornes-libre-service/travel-list.webp" alt=""></div></div>
  <div class="tablet" style="left:90px;top:170px;width:1020px;height:818px"><div class="screen"><img src="assets/bornes-libre-service/home.webp" alt=""></div></div>
</section>

<section class="shot portrait bk" data-shot="cover-phone" data-reframe="cover" data-frame="800,600,1.2"></section>

<section class="shot bk" data-shot="section-1">
  <div class="orbits"><i style="width:1500px;height:520px"></i><i style="width:1100px;height:380px"></i></div>
  <div class="tablet" style="left:50px;top:190px;width:735px;height:596px"><div class="screen"><img src="assets/bornes-libre-service/passenger-infos.webp" alt=""></div></div>
  <div class="tablet" style="left:815px;top:190px;width:735px;height:596px"><div class="screen"><img src="assets/bornes-libre-service/pay-init.webp" alt=""></div></div>
</section>

<script src="kit.js"></script>
</body>
</html>
