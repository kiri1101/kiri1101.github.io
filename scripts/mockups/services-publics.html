<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>services-publics — screenshots framed</title>
<link rel="stylesheet" href="kit.css">
<style>
  .sp { --from: #0b1a14; --to: #14352a; }
  .sp .body img { position: absolute; display: block; }
</style>
</head>
<body>

<!-- The owner-validated screenshot of the portal (legacy/img), framed in Orbit's browser window. -->
<section class="shot cover sp" data-shot="cover">
  <div class="orbits"><i style="width:1500px;height:520px"></i><i style="width:1100px;height:380px"></i></div>
  <div class="window" style="left:100px;top:140px;width:1400px;height:921px">
    <div class="titlebar"><i></i><i></i><i></i><span class="url"><b>servicespublics</b></span></div>
    <div class="body"><img src="/legacy/img/services-publics.webp" alt="" style="left:0;top:0;width:1400px;height:875px"></div>
  </div>
</section>

<section class="shot portrait sp" data-shot="cover-phone" data-reframe="cover" data-frame="800,560,1.5"></section>

<!-- The same screenshot, enlarged on the welcome area and the two entry points. -->
<section class="shot sp" data-shot="section-1">
  <div class="orbits"><i style="width:1500px;height:520px"></i><i style="width:1100px;height:380px"></i></div>
  <div class="window" style="left:150px;top:90px;width:1300px;height:820px">
    <div class="titlebar"><i></i><i></i><i></i><span class="url"><b>servicespublics</b></span></div>
    <div class="body"><img src="/legacy/img/services-publics.webp" alt="" style="left:-10px;top:-20px;width:1900px;height:1188px"></div>
  </div>
</section>

<script src="kit.js"></script>
</body>
</html>
