<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Open Graph image, home</title>
<link rel="stylesheet" href="kit.css">
<style>
  html, body { margin: 0; background: #0b0b0e; }
  #og { position: relative; width: 1200px; height: 630px; overflow: hidden; color: #f2efe8;
    background: radial-gradient(70% 90% at 82% 45%, #2b1f45 0%, #14101c 55%, #0b0b0e 100%); }
  #og .orb { position: absolute; right: -10px; top: 60px; width: 540px; height: 540px; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,218,.95) 0 7%, rgba(255,170,110,.6) 24%, rgba(255,150,86,.22) 48%, rgba(255,150,86,0) 70%); }
  #og .ring { position: absolute; left: 50%; top: 50%; border: 1.5px solid rgba(255,255,255,.1); border-radius: 50%; transform: translate(-50%, -50%) rotate(-14deg); }
  #og .wrap { position: absolute; inset: 0; padding: 70px 80px; display: flex; flex-direction: column; }
  #og .eyebrow { display: flex; align-items: center; gap: 16px; font-size: 21px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: #e8b891; }
  #og .eyebrow::before { content: ""; width: 40px; height: 2px; background: currentColor; }
  #og h1 { margin: 34px 0 0; font-size: 104px; line-height: .96; font-weight: 700; letter-spacing: -.035em; }
  #og h1 em { font-family: "Instrument Serif", serif; font-weight: 400; color: #e8b891; }
  #og p { margin: 26px 0 0; max-width: 640px; font-size: 29px; line-height: 1.35; color: rgba(242,239,232,.72); }
  #og .foot { margin-top: auto; display: flex; gap: 14px; font-size: 21px; font-weight: 600; }
  #og .chip { padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  #og .chip.solid { background: #f2efe8; color: #0b0b0e; box-shadow: none; }
</style>
</head>
<body>
<div id="og">
  <div class="ring" style="width:1100px;height:380px"></div>
  <div class="ring" style="width:760px;height:260px"></div>
  <div class="orb"></div>
  <div class="wrap">
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Jordan<br><em>Tukum Folem</em></h1>
    <p id="lead"></p>
    <div class="foot"><span class="chip solid">Laravel · Vue · React</span><span class="chip" id="tests"></span><span class="chip">jordan-tukum.pages.dev</span></div>
  </div>
</div>
<script>
  const en = location.hash === "#en";
  document.getElementById("eyebrow").textContent = en ? "Full Stack Web & Mobile Developer · Douala" : "Développeur Full Stack Web & Mobile · Douala";
  document.getElementById("lead").textContent = en ? "Web and mobile platforms, several of them at national scale in Cameroon." : "Des plateformes web et mobiles, dont plusieurs à l’échelle nationale au Cameroun.";
  document.getElementById("tests").textContent = en ? "2,000+ tests" : "2 000+ tests";
</script>
</body>
</html>
